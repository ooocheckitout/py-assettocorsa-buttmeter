name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive -o WheelLock.zip HEAD apps content
      - run: gh release upload "${{ github.event.release.tag_name }}" WheelLock.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
